# Full reference: https://github.com/lowlighter/metrics/blob/master/action.yml
name: Metrics

on:
  # Once a day is plenty and keeps the git history readable
  schedule: [{cron: "17 4 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yaml]

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          # Classic PAT with scopes: read:user, read:org (optional: repo for private stats)
          token: ${{ secrets.METRICS_TOKEN }}
          committer_message: "chore(metrics): update ${filename} [skip ci]"

          user: ClemontX
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Berlin
          config_display: large

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_ignored: html, css, dockerfile
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 30
          plugin_habits_from: 200
